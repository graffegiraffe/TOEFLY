name: list_vocabulary_units
description: planning-service reads the approved Collins Vocabulary units in order to plan the vocabulary track (docs/12 phase 4, decision 10)
request:
  method: GET
  url: /api/v1/vocabulary-units
  headers:
    Authorization: Bearer service-token
response:
  status: 200
  body:
    items:
      - unitNo: 1
        title: Visual art
  matchers:
    body:
      - path: $.items[0].id
        type: by_regex
        predefined: uuid
