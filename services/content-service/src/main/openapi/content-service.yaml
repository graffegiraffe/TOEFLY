openapi: 3.1.0
info:
  title: content-service
  version: 0.1.0
  description: Item bank, sources, search, reports and moderation (docs/05-api-contracts.md section 6.2).
servers:
  - url: http://localhost:8082
security:
  - bearerAuth: []
paths:
  /api/v1/item-sets:
    get:
      tags: [ItemSets]
      operationId: listItemSets
      summary: Catalog of approved item sets without answer keys
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/Section' }
        - { $ref: '#/components/parameters/TaskType' }
        - { $ref: '#/components/parameters/ExamFormat' }
        - { $ref: '#/components/parameters/Provenance' }
        - { $ref: '#/components/parameters/Cefr' }
        - { $ref: '#/components/parameters/Legacy' }
        - { $ref: '#/components/parameters/SourceCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A page of summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemSetSummaryPage' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/item-sets/search:
    get:
      tags: [ItemSets]
      operationId: searchItemSets
      summary: Hybrid search (full text plus vectors); degrades to full text when embeddings are unavailable
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { $ref: '#/components/parameters/Section' }
        - { $ref: '#/components/parameters/TaskType' }
        - { $ref: '#/components/parameters/ExamFormat' }
        - { $ref: '#/components/parameters/Provenance' }
        - { $ref: '#/components/parameters/Cefr' }
        - { $ref: '#/components/parameters/Legacy' }
        - { $ref: '#/components/parameters/SourceCode' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Ranked hits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemSetSearchResult' }
  /api/v1/item-sets/{itemSetId}:
    get:
      tags: [ItemSets]
      operationId: getItemSet
      summary: An item set for display, without answer keys, explanations and transcripts
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/ItemSetId' }
      responses:
        '200':
          description: The item set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemSet' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: Books and sites the items come from
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      responses:
        '200':
          description: All sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceList' }
  /api/v1/item-reports:
    post:
      tags: [Reports]
      operationId: createItemReport
      summary: Report an item set or one of its items
      x-toefly-roles: [STUDENT, TUTOR]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemReportRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemReport' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/item-sets:
    get:
      tags: [Admin]
      operationId: adminListItemSets
      summary: Moderation list
      x-toefly-roles: [ADMIN]
      parameters:
        - { $ref: '#/components/parameters/Section' }
        - { $ref: '#/components/parameters/TaskType' }
        - { $ref: '#/components/parameters/ExamFormat' }
        - { $ref: '#/components/parameters/Provenance' }
        - { $ref: '#/components/parameters/Cefr' }
        - { $ref: '#/components/parameters/Legacy' }
        - { $ref: '#/components/parameters/SourceCode' }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ItemStatus' } }
        - { name: reported, in: query, required: false, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A page of moderation rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminItemSetPage' }
  /api/v1/admin/item-sets/{itemSetId}:
    get:
      tags: [Admin]
      operationId: adminGetItemSet
      summary: The full item set with keys, for moderation
      x-toefly-roles: [ADMIN]
      parameters:
        - { $ref: '#/components/parameters/ItemSetId' }
      responses:
        '200':
          description: The item set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemSet' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Admin]
      operationId: adminPatchItemSet
      summary: Change the status of an item set (HIDDEN, APPROVED, REJECTED)
      x-toefly-roles: [ADMIN]
      parameters:
        - { $ref: '#/components/parameters/ItemSetId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminItemSetPatch' }
      responses:
        '200':
          description: The updated row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminItemSetRow' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/sources/{sourceCode}/hide:
    post:
      tags: [Admin]
      operationId: adminHideSource
      summary: Hide every item set of a source (takedown on request of a rights holder)
      x-toefly-roles: [ADMIN]
      parameters:
        - { name: sourceCode, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: How many sets were hidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HideSourceResult' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/item-reports:
    get:
      tags: [Admin]
      operationId: adminListItemReports
      summary: Complaints
      x-toefly-roles: [ADMIN]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ReportStatus' } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Reports, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemReportPage' }
  /api/v1/admin/item-reports/{reportId}:
    patch:
      tags: [Admin]
      operationId: adminResolveItemReport
      summary: Decide on a complaint
      x-toefly-roles: [ADMIN]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveItemReportRequest' }
      responses:
        '200':
          description: The closed report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemReport' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/imports:
    post:
      tags: [Admin]
      operationId: adminStartImport
      summary: Import the seed bundle (idempotent)
      x-toefly-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartImportRequest' }
      responses:
        '202':
          description: The report of the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
  /api/v1/grammar-units:
    get:
      tags: [Units]
      operationId: listGrammarUnits
      summary: Approved grammar units (Round-Up 5, Collins grammar)
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      parameters:
        - { name: framework, in: query, required: false, schema: { type: string, enum: [ROUND_UP_5, COLLINS_GRAMMAR] } }
      responses:
        '200':
          description: Units in book order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarUnitList' }
  /api/v1/grammar-units/{unitId}:
    get:
      tags: [Units]
      operationId: getGrammarUnit
      summary: A grammar unit with its rule card and exercises
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarUnit' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/vocabulary-units:
    get:
      tags: [Units]
      operationId: listVocabularyUnits
      summary: Approved vocabulary units (Collins)
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      responses:
        '200':
          description: Units in book order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyUnitList' }
  /api/v1/vocabulary-units/{unitId}:
    get:
      tags: [Units]
      operationId: getVocabularyUnit
      summary: A vocabulary unit with its words
      x-toefly-roles: [STUDENT, TUTOR, ADMIN]
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyUnit' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/grammar-units:
    get:
      tags: [AdminUnits]
      operationId: adminListGrammarUnits
      summary: All grammar units including those waiting for review
      x-toefly-roles: [ADMIN]
      responses:
        '200':
          description: Units
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarUnitList' }
  /api/v1/admin/vocabulary-units:
    get:
      tags: [AdminUnits]
      operationId: adminListVocabularyUnits
      summary: All vocabulary units including those waiting for review
      x-toefly-roles: [ADMIN]
      responses:
        '200':
          description: Units
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyUnitList' }
  /api/v1/admin/grammar-units/{unitId}/approval:
    post:
      tags: [AdminUnits]
      operationId: adminApproveGrammarUnit
      summary: Approve a reviewed grammar unit
      x-toefly-roles: [ADMIN]
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The approved unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarUnit' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/vocabulary-units/{unitId}/approval:
    post:
      tags: [AdminUnits]
      operationId: adminApproveVocabularyUnit
      summary: Approve a reviewed vocabulary unit
      x-toefly-roles: [ADMIN]
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The approved unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyUnit' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/item-sets/{itemSetId}:
    get:
      tags: [Internal]
      operationId: internalGetItemSet
      summary: The item set with answer keys, for practice-service
      x-toefly-roles: [SERVICE]
      parameters:
        - { $ref: '#/components/parameters/ItemSetId' }
      responses:
        '200':
          description: The item set with keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemSet' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/item-sets/search:
    post:
      tags: [Internal]
      operationId: searchItemSetsInternal
      summary: Extra practice sets for the searchItems tool of the tutor agent
      description: |
        Approved TOEFL_2026 sets of the task type, never those tagged `exam-reserved`, without vector search
        (docs/12 phase 5c decision 2). `skillFocus` matches a skill tag of the set (`reading.inference`, case-insensitive)
        or the subskill of one of its items (`INFERENCE`, the part after the last dot); `topic` matches the topic or the
        full text of the set. With `referenceB` the difficulty filters b: `EASIER` < b − 0.5, `SAME` within ±0.5,
        `HARDER` > b + 0.5, closest to `referenceB` first; without it the order is by id. Accepts the scope `internal`
        or any user JWT (the catalog is not personal).
      x-toefly-internal: true
      x-toefly-leaf: true
      x-toefly-safe: true
      x-toefly-roles: [SERVICE]
      security:
        - serviceAuth: [internal]
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemSetSearchQuery' }
      responses:
        '200':
          description: At most `limit` sets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemSetSearchHits' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /internal/v1/grammar-units/search:
    get:
      tags: [Internal]
      operationId: searchGrammarUnitsInternal
      summary: Grammar units for the explainGrammarRule tool of the tutor agent
      description: |
        Approved grammar units. `subcategory` (for example `GRAMMAR.ARTICLES`) finds its unit through the mistake
        taxonomy of docs/06 §6.3; `topic` matches words of the unit titles and topic codes, and a taxonomy code or a
        unit code (`ROUNDUP5.U10`) given as the topic is resolved the same way. The unit of the subcategory comes
        first, then units by the number of matching words. Without both the list is empty. Accepts the scope
        `internal` or any user JWT.
      x-toefly-internal: true
      x-toefly-leaf: true
      x-toefly-roles: [SERVICE]
      security:
        - serviceAuth: [internal]
        - bearerAuth: []
      parameters:
        - { name: topic, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: subcategory, in: query, required: false, schema: { type: string, maxLength: 60 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 3 } }
      responses:
        '200':
          description: Units, best match first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarUnitHits' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    serviceAuth:
      type: oauth2
      description: Client credentials of `svc-<service>`.
      flows:
        clientCredentials:
          tokenUrl: https://auth.toefly.app/realms/toefly/protocol/openid-connect/token
          scopes:
            internal: Service-to-service calls
  parameters:
    ItemSetId: { name: itemSetId, in: path, required: true, schema: { type: string, format: uuid } }
    Section: { name: section, in: query, required: false, schema: { $ref: '#/components/schemas/Section' } }
    TaskType: { name: taskType, in: query, required: false, schema: { $ref: '#/components/schemas/TaskType' } }
    ExamFormat: { name: examFormat, in: query, required: false, schema: { $ref: '#/components/schemas/ExamFormat' } }
    Provenance: { name: provenance, in: query, required: false, schema: { $ref: '#/components/schemas/Provenance' } }
    Cefr: { name: cefr, in: query, required: false, schema: { type: string, enum: [A1, A2, B1, B2, C1, C2] } }
    Legacy: { name: legacy, in: query, required: false, schema: { type: boolean } }
    SourceCode: { name: sourceCode, in: query, required: false, schema: { type: string } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Section: { type: string, enum: [READING, LISTENING, WRITING, SPEAKING] }
    ExamFormat: { type: string, enum: [TOEFL_2026, LEGACY] }
    Provenance: { type: string, enum: [EXTRACTED, GENERATED, TUTOR_CREATED] }
    ItemStatus: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, HIDDEN, REJECTED] }
    ReportStatus: { type: string, enum: [OPEN, RESOLVED, DISMISSED] }
    ReportReason: { type: string, enum: [WRONG_KEY, TYPO, UNCLEAR, AUDIO_PROBLEM, INAPPROPRIATE, COPYRIGHT, OTHER] }
    TaskType:
      type: string
      enum: [COMPLETE_THE_WORDS, READ_DAILY_LIFE, READ_ACADEMIC_PASSAGE, LISTEN_CHOOSE_RESPONSE, LISTEN_CONVERSATION,
             LISTEN_ANNOUNCEMENT, LISTEN_ACADEMIC_TALK, BUILD_A_SENTENCE, WRITE_EMAIL, WRITE_ACADEMIC_DISCUSSION,
             LISTEN_AND_REPEAT, TAKE_AN_INTERVIEW, GRAMMAR_EXERCISE, VOCAB_EXERCISE, LEGACY_READING, LEGACY_LISTENING]
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: string }
        hasMore: { type: boolean }
    SourceRef:
      type: object
      required: [code, title, attribution, legacy]
      properties:
        code: { type: string }
        title: { type: string }
        publisher: { type: string }
        year: { type: integer }
        url: { type: string }
        attribution: { type: string }
        legacy: { type: boolean }
    ItemSetSummary:
      type: object
      required: [id, taskType, examFormat, topic, itemCount, estimatedMinutes, version, source]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        taskType: { $ref: '#/components/schemas/TaskType' }
        section: { $ref: '#/components/schemas/Section' }
        examFormat: { $ref: '#/components/schemas/ExamFormat' }
        cefr: { type: string }
        topic: { type: string }
        itemCount: { type: integer }
        estimatedMinutes: { type: number }
        source: { $ref: '#/components/schemas/SourceRef' }
    ItemSetSummaryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemSetSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SearchHit:
      type: object
      required: [itemSet, score]
      properties:
        itemSet: { $ref: '#/components/schemas/ItemSetSummary' }
        score: { type: number }
    ItemSetSearchResult:
      type: object
      required: [mode, hits]
      properties:
        mode:
          type: string
          enum: [HYBRID, FULL_TEXT]
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
    ItemSet:
      type: object
      required: [id, version, taskType, examFormat, topic, itemCount, estimatedMinutes, status, source, payload]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        taskType: { $ref: '#/components/schemas/TaskType' }
        section: { $ref: '#/components/schemas/Section' }
        examFormat: { $ref: '#/components/schemas/ExamFormat' }
        cefr: { type: string }
        topic: { type: string }
        skills:
          type: array
          items: { type: string }
        itemCount: { type: integer }
        estimatedMinutes: { type: number }
        etsNormSeconds: { type: integer }
        status: { $ref: '#/components/schemas/ItemStatus' }
        source: { $ref: '#/components/schemas/SourceRef' }
        payload:
          type: object
          additionalProperties: true
        extraction: { $ref: '#/components/schemas/Extraction' }
    Extraction:
      type: object
      description: How a seed object was extracted (docs/08-content-pipeline.md §4.7); administrator views only
      required: [method, reviewed, warnings]
      properties:
        method: { type: string, enum: [TEXT_LAYER, HTML_DATA, OCR_LLM] }
        reviewed: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    SourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceRef' }
    CreateItemReportRequest:
      type: object
      required: [itemSetId, reason]
      properties:
        itemSetId: { type: string, format: uuid }
        itemOrdinal: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/ReportReason' }
        comment: { type: string, maxLength: 1000 }
    ItemReport:
      type: object
      required: [id, itemSetId, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemSetId: { type: string, format: uuid }
        itemOrdinal: { type: integer }
        reason: { $ref: '#/components/schemas/ReportReason' }
        comment: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    ItemReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemReport' }
    ResolveItemReportRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [RESOLVED, DISMISSED]
        hideItemSet: { type: boolean, default: false }
    AdminItemSetRow:
      type: object
      required: [id, taskType, examFormat, topic, status, provenance, sourceCode, openReports, version]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        taskType: { $ref: '#/components/schemas/TaskType' }
        examFormat: { $ref: '#/components/schemas/ExamFormat' }
        cefr: { type: string }
        topic: { type: string }
        status: { $ref: '#/components/schemas/ItemStatus' }
        hiddenReason: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
        sourceCode: { type: string }
        itemCount: { type: integer }
        openReports: { type: integer }
        extractionWarnings: { type: integer, description: Number of extraction warnings of the set }
    AdminItemSetPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminItemSetRow' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AdminItemSetPatch:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [HIDDEN, APPROVED, REJECTED]
    HideSourceResult:
      type: object
      required: [sourceCode, hidden]
      properties:
        sourceCode: { type: string }
        hidden: { type: integer }
    StartImportRequest:
      type: object
      properties:
        sourceCode: { type: string }
        dryRun: { type: boolean, default: false }
    ImportReport:
      type: object
      required: [dryRun, sources]
      properties:
        dryRun: { type: boolean }
        sources:
          type: array
          items:
            type: object
            required: [sourceCode, status, created, updated, unchanged, hidden]
            properties:
              sourceCode: { type: string }
              status: { type: string }
              created: { type: integer }
              updated: { type: integer }
              unchanged: { type: integer }
              hidden: { type: integer }
              error: { type: string }
    GrammarUnit:
      type: object
      required: [id, framework, unitNo, title, status, topicCodes, sourceCode, exercises]
      properties:
        id: { type: string, format: uuid }
        framework: { type: string }
        unitNo: { type: integer }
        title: { type: string }
        status: { $ref: '#/components/schemas/ItemStatus' }
        sourceCode: { type: string }
        topicCodes:
          type: array
          items: { type: string }
        progressCheckNo: { type: integer }
        ruleCard:
          type: object
          additionalProperties: true
        exercises:
          type: array
          items: { type: object, additionalProperties: true }
        extraction: { $ref: '#/components/schemas/Extraction' }
    GrammarUnitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GrammarUnit' }
    VocabularyWord:
      type: object
      required: [word, pos, definition]
      properties:
        word: { type: string }
        pos: { type: string }
        definition: { type: string }
        example: { type: string }
    VocabularyUnit:
      type: object
      required: [id, unitNo, theme, title, status, sourceCode, words, exercises]
      properties:
        id: { type: string, format: uuid }
        unitNo: { type: integer }
        theme: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ItemStatus' }
        sourceCode: { type: string }
        words:
          type: array
          items: { $ref: '#/components/schemas/VocabularyWord' }
        exercises:
          type: array
          items: { type: object, additionalProperties: true }
        extraction: { $ref: '#/components/schemas/Extraction' }
    VocabularyUnitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VocabularyUnit' }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    RelativeDifficulty: { type: string, enum: [EASIER, SAME, HARDER] }
    ItemSetSearchQuery:
      type: object
      required: [taskType]
      additionalProperties: false
      properties:
        taskType: { $ref: '#/components/schemas/TaskType' }
        skillFocus: { type: string, maxLength: 80, description: 'Skill tag or mistake subcategory, e.g. READING.INFERENCE' }
        topic: { type: string, maxLength: 100 }
        difficulty: { allOf: [{ $ref: '#/components/schemas/RelativeDifficulty' }], default: SAME }
        referenceB: { type: number, minimum: -4, maximum: 4, description: 'Difficulty b that `difficulty` is relative to' }
        excludeItemSetIds: { type: array, maxItems: 200, items: { type: string, format: uuid } }
        limit: { type: integer, minimum: 1, maximum: 5, default: 3 }
    ItemSetSearchHits:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemSetHitSummary' }
    ItemSetHitSummary:
      type: object
      required: [itemSetId, taskType, title, estimatedMinutes, difficultyB, skills]
      properties:
        itemSetId: { type: string, format: uuid }
        taskType: { $ref: '#/components/schemas/TaskType' }
        title: { type: string, description: 'Title of the stimulus, else the topic' }
        topic: { type: string }
        estimatedMinutes: { type: number }
        difficultyB: { type: number }
        skills: { type: array, items: { type: string } }
    GrammarUnitHits:
      type: object
      required: [units]
      properties:
        units:
          type: array
          items: { $ref: '#/components/schemas/GrammarUnitHit' }
    GrammarUnitHit:
      type: object
      required: [unitId, code, title, source, estimatedMinutes]
      properties:
        unitId: { type: string, format: uuid }
        code: { type: string, description: 'Unit code of the taxonomy, e.g. ROUNDUP5.U10' }
        title: { type: string }
        source: { type: string, description: 'Title of the source book' }
        estimatedMinutes: { type: number, description: 'Planned time of a grammar unit (60 minutes, as planning-service)' }
        summary: { type: string, description: 'Summary of the rule card, if the unit has one' }
