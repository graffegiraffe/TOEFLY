spring:
  application:
    name: planning-service
  config:
    import: classpath:week-composition.yaml
  datasource:
    url: jdbc:postgresql://localhost:${TOEFLY_POSTGRES_PORT:5432}/planning_db
    username: planning_app
    password: planning_app
  flyway:
    locations: classpath:db/migration,classpath:db/common
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: planning-service
      auto-offset-reset: earliest
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
      properties:
        apicurio.registry.url: ${toefly.events.registry-url}
        apicurio.registry.use-specific-avro-reader: true
        apicurio.registry.fault-tolerant-refresh: true
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/toefly
          audiences: toefly-api
      client:
        registration:
          svc-planning-service:
            provider: keycloak
            client-id: svc-planning-service
            client-secret: ${SVC_PLANNING_SERVICE_SECRET:svc-planning-service-local}
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/toefly/protocol/openid-connect/token
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8087

toefly:
  events:
    registry-url: http://localhost:8380/apis/registry/v3
    auto-register: false
  planning:
    content-url: http://localhost:8082
    # WeekGenerator (docs/06 §5.2): background group of ai-gateway calls; a call waits up to 60 s for quota inside it.
    ai-gateway-url: http://localhost:8095
    ai-read-timeout: PT120S
    # Writing joins in phase 5b; the open Speaking types wait for phase 6 (docs/12, phase 4 decision 2, 5b decision 14).
    available-task-types:
      - COMPLETE_THE_WORDS
      - READ_DAILY_LIFE
      - READ_ACADEMIC_PASSAGE
      - LISTEN_CHOOSE_RESPONSE
      - LISTEN_CONVERSATION
      - LISTEN_ANNOUNCEMENT
      - LISTEN_ACADEMIC_TALK
      - BUILD_A_SENTENCE
      - WRITE_EMAIL
      - WRITE_ACADEMIC_DISCUSSION
      - GRAMMAR_EXERCISE
    vocabulary-review-enabled: false
    mock-exam-enabled: false
    exam-format: TOEFL_2026
    rollover:
      enabled: true
      interval: PT5M
    resources:
      - url: https://www.toeflresources.com/toefl-reading/
        title: "toeflresources.com: Reading section"
        sections: [READING]
      - url: https://www.toeflresources.com/listening/
        title: "toeflresources.com: Listening section"
        sections: [LISTENING]
      - url: https://www.toeflresources.com/writing-section/
        title: "toeflresources.com: Writing section"
        sections: [WRITING]
      - url: https://www.toeflresources.com/speaking-section/
        title: "toeflresources.com: Speaking section"
        sections: [SPEAKING]

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

---
spring:
  config:
    activate:
      on-profile: local
toefly:
  events:
    auto-register: true
  planning:
    rollover:
      interval: PT1M

---
spring:
  config:
    activate:
      on-profile: k8s
logging:
  structured:
    format:
      console: ecs
