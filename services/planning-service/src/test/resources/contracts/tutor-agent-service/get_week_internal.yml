name: get_week_internal
description: tutor-agent-service reads a week by id for the weekly review
request:
  method: GET
  url: /internal/v1/weeks/5b1e9c3a-2f0d-4c8e-9a7b-1d2c3e4f5a6b
  headers:
    Authorization: Bearer service-token
response:
  status: 200
  body:
    weekId: 5b1e9c3a-2f0d-4c8e-9a7b-1d2c3e4f5a6b
    weekNo: 1
  matchers:
    body:
      - path: $.progressPercent
        type: by_type
      - path: $.version
        type: by_type
