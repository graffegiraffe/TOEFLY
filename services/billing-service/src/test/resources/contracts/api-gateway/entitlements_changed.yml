name: entitlements_changed
description: api-gateway drops the cached rights ent:{userId}; the snapshot replaces the projection of a consumer
input:
  triggeredBy: entitlementsChanged()
outputMessage:
  sentTo: toefly.billing.entitlements-changed.v1
  headers:
    ce_specversion: "1.0"
    ce_source: /toefly/billing-service
    content-type: application/avro
    ce_type: toefly.billing.entitlements-changed.v1
  body:
    planTierCode: STUDENT_PRO
  matchers:
    body:
      - path: $.userId
        type: by_regex
        predefined: uuid
      - path: $.entitlementsVersion
        type: by_type
      - path: $.entitlements
        type: by_type
        minOccurrence: 1
      - path: $.grants
        type: by_type
        minOccurrence: 1
      - path: $.trialEndsAt
        type: by_type
