name: account_deletion_requested
description: planning-service deletes the plan and the weeks of the user and confirms the deletion
input:
  triggeredBy: accountDeletionRequested()
outputMessage:
  sentTo: toefly.profile.account-deletion-requested.v1
  headers:
    ce_type: toefly.profile.account-deletion-requested.v1
    ce_specversion: "1.0"
    ce_source: /toefly/profile-service
    content-type: application/avro
  body:
    roles: [STUDENT]
  matchers:
    body:
      - path: $.userId
        type: by_regex
        predefined: uuid
      - path: $.eventId
        type: by_regex
        predefined: uuid
      - path: $.deletionId
        type: by_regex
        predefined: uuid
      - path: $.legalDeadlineAt
        type: by_regex
        predefined: number
