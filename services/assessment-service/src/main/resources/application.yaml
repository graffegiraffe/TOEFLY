spring:
  application:
    name: assessment-service
  datasource:
    url: jdbc:postgresql://localhost:${TOEFLY_POSTGRES_PORT:5432}/assessment_db
    username: assessment_app
    password: assessment_app
  flyway:
    locations: classpath:db/migration,classpath:db/common
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: assessment-service
      auto-offset-reset: earliest
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
      properties:
        apicurio.registry.url: ${toefly.events.registry-url}
        apicurio.registry.use-specific-avro-reader: true
        apicurio.registry.fault-tolerant-refresh: true
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/toefly
          audiences: toefly-api
      client:
        registration:
          svc-assessment-service:
            provider: keycloak
            client-id: svc-assessment-service
            client-secret: ${SVC_ASSESSMENT_SERVICE_SECRET:svc-assessment-service-local}
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/toefly/protocol/openid-connect/token
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8085

toefly:
  events:
    registry-url: http://localhost:8380/apis/registry/v3
    auto-register: false
  assessment:
    content-url: http://localhost:8082
    ai-gateway-url: http://localhost:8095
    # Background group of ai-gateway calls (docs/05 §9.3.8); a pass waits up to 30 s for quota inside ai-gateway.
    ai-read-timeout: PT90S
    deferred:
      enabled: true
      interval: PT1M

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

---
spring:
  config:
    activate:
      on-profile: local
toefly:
  events:
    auto-register: true

---
spring:
  config:
    activate:
      on-profile: k8s
logging:
  structured:
    format:
      console: ecs
