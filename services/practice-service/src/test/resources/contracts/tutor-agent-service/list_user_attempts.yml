name: list_user_attempts
description: tutor-agent-service reads the latest attempts of a learner for its tools
request:
  method: GET
  url: /internal/v1/users/0b6f1c0e-3b0c-4f3e-9d57-6a3f1d1d7a11/attempts?limit=5
  headers:
    Authorization: Bearer service-token
response:
  status: 200
  matchers:
    body:
      - path: $.items
        type: by_type
        minOccurrence: 1
      - path: $.items[0].attemptId
        type: by_regex
        predefined: uuid
      - path: $.items[0].taskType
        type: by_regex
        regex: "[A-Z_]+"
