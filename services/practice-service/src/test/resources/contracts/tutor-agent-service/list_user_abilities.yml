name: list_user_abilities
description: tutor-agent-service reads theta by section of a learner
request:
  method: GET
  url: /internal/v1/users/0b6f1c0e-3b0c-4f3e-9d57-6a3f1d1d7a11/abilities
  headers:
    Authorization: Bearer service-token
response:
  status: 200
  body:
    items:
      - section: READING
  matchers:
    body:
      - path: $.items[0].theta
        type: by_regex
        predefined: number
