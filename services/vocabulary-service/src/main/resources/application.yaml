spring:
  application:
    name: vocabulary-service
  datasource:
    url: jdbc:postgresql://localhost:${TOEFLY_POSTGRES_PORT:5432}/vocabulary_db
    username: vocabulary_app
    password: vocabulary_app
  flyway:
    locations: classpath:db/migration,classpath:db/common
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: vocabulary-service
      auto-offset-reset: earliest
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
      properties:
        apicurio.registry.url: ${toefly.events.registry-url}
        apicurio.registry.use-specific-avro-reader: true
        apicurio.registry.fault-tolerant-refresh: true
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/toefly
          audiences: toefly-api
      client:
        registration:
          svc-vocabulary-service:
            provider: keycloak
            client-id: svc-vocabulary-service
            client-secret: ${SVC_VOCABULARY_SERVICE_SECRET:svc-vocabulary-service-local}
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/toefly/protocol/openid-connect/token
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8090

toefly:
  events:
    registry-url: http://localhost:8380/apis/registry/v3
    auto-register: false
  vocabulary:
    content-url: http://localhost:8082
    ai-gateway-url: http://localhost:8095
    # Word cards and key words go through ai-gateway; off until its vocabulary prompts are registered.
    ai:
      enabled: ${TOEFLY_VOCABULARY_AI_ENABLED:false}
    # The pronunciation button needs speech-service (phase 6).
    pronunciation-enabled: false

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

---
spring:
  config:
    activate:
      on-profile: local
toefly:
  events:
    auto-register: true

---
spring:
  config:
    activate:
      on-profile: k8s
logging:
  structured:
    format:
      console: ecs
