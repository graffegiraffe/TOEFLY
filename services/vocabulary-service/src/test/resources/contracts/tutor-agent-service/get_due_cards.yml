name: get_due_cards
description: the getVocabularyDue tool of the agent (docs/06 §4)
request:
  method: GET
  url: /internal/v1/students/5a1c0e7d-2b3f-4c6d-8e9f-0a1b2c3d4e5f/cards/due
  headers:
    Authorization: Bearer service-token
response:
  status: 200
  matchers:
    body:
      - path: $.dueCount
        type: by_type
      - path: $.newCount
        type: by_type
      - path: $.items
        type: by_type
        minOccurrence: 1
      - path: $.items[0].term
        type: by_type
