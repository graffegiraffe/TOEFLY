name: add_student_entry
description: the addWordToVocabulary tool of the agent (docs/06 §4)
request:
  method: POST
  url: /internal/v1/students/5a1c0e7d-2b3f-4c6d-8e9f-0a1b2c3d4e5f/entries
  headers:
    Authorization: Bearer service-token
    Content-Type: application/json
    Idempotency-Key: tool-call-0001
  body:
    term: Detrimental
    contextSentence: Noise can be detrimental to sleep.
response:
  status: 201
  body:
    lemma: detrimental
    origin: MANUAL
    status: NEW
  matchers:
    body:
      - path: $.id
        type: by_regex
        predefined: uuid
      - path: $.card.state
        type: by_type
