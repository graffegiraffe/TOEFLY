name: release

on:
  push:
    tags: ["*/v*"]

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: develop
      - id: module
        name: Resolve the module of the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module="${TAG%%/v*}"
          case "$module" in
            platform) path=. ;;
            web|ios|landing) path="clients/$module" ;;
            toefly-*|platform-bom) path="libs/$module" ;;
            *) path="services/$module" ;;
          esac
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: >-
            --tag-pattern "^${{ steps.module.outputs.module }}/v"
            ${{ steps.module.outputs.path != '.' && format('--include-path {0}/**', steps.module.outputs.path) || '' }}
        env:
          OUTPUT: ${{ steps.module.outputs.path }}/CHANGELOG.md
      # develop accepts changes only through pull requests, so the changelog arrives as a small PR.
      - name: Open a pull request with the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.module.outputs.path }}/CHANGELOG.md
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && exit 0
          title="chore(release): ${TAG%%/v*} v${TAG##*/v}"
          branch="chore/changelog-${TAG/\//-}"
          git switch -c "$branch"
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" --title "$title" --body "Changelog generated by git-cliff for $TAG."
