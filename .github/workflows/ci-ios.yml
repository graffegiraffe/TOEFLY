name: ci-ios

on:
  pull_request:
    paths: ["clients/ios/**"]
  push:
    branches: [develop, main]
    paths: ["clients/ios/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The iOS client appears in phase 12; until the Xcode project exists the macOS job is skipped.
  # hashFiles() is not available in a job-level `if`, so a cheap job looks for the project first.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project: ${{ steps.project.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: project
        run: |
          if [ -f clients/ios/Toefly.xcodeproj/project.pbxproj ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::clients/ios/Toefly.xcodeproj does not exist yet; the iOS build is skipped"
          fi

  ios:
    needs: detect
    if: needs.detect.outputs.project == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swiftlint --strict
      - run: swiftformat --lint .
      - name: Build and test on the simulator
        run: >-
          xcodebuild test -project Toefly.xcodeproj -scheme Toefly
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          CODE_SIGNING_ALLOWED=NO
