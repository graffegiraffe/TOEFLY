name: ci-ios

on:
  pull_request:
    paths:
      - "clients/ios/**"
      # The generated Swift clients read these contracts through links in clients/ios/Packages/ToeflyKit.
      - "services/profile-service/src/main/openapi/**"
      - "services/planning-service/src/main/openapi/**"
      - ".github/workflows/ci-ios.yml"
  push:
    branches: [develop, main]
    paths:
      - "clients/ios/**"
      - "services/profile-service/src/main/openapi/**"
      - "services/planning-service/src/main/openapi/**"
      - ".github/workflows/ci-ios.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the toolchain
        run: xcodebuild -version && swift --version
      - name: Install SwiftLint and SwiftFormat
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v swiftformat >/dev/null || brew install swiftformat
      - run: swiftlint --strict
      - run: swiftformat --lint .
      - name: Unit tests and view model coverage (≥ 80%)
        working-directory: clients/ios/Packages/ToeflyKit
        run: |
          swift test --enable-code-coverage
          python3 ../../scripts/check-coverage.py "$(swift test --show-codecov-path)" ToeflyFeatures 80
      - name: Build and test on the simulator
        run: >-
          xcodebuild test -project Toefly.xcodeproj -scheme Toefly
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -skipPackagePluginValidation -skipMacroValidation
          -resultBundlePath build/Toefly.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Keep the test results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: clients/ios/build/Toefly.xcresult
          if-no-files-found: ignore
          retention-days: 14
