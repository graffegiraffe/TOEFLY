<title>TOEFLY prototype</title>
<script>
  /* resolve the theme before first paint */
  (function () {
    var s = {}; try { s = JSON.parse(localStorage.getItem('toefly-prototype') || '{}'); } catch (e) {}
    var t = s.theme || 'system';
    if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    if (s.reduced) document.documentElement.setAttribute('data-transparency', 'reduced');
  })();
</script>
