openapi: 3.1.0
info:
  title: ${artifactId}
  version: 0.1.0
  description: Sample endpoint of the service template; replace it with the service contract from docs/05-api-contracts.md.
servers:
  - url: http://localhost:${servicePort}
security:
  - bearerAuth: []
paths:
  /api/v1/items:
    post:
      tags: [Items]
      operationId: createItem
      summary: Create an item and publish ItemCreated through the outbox
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CreateItemRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    ItemResponse:
      type: object
      required: [id, title, createdAt, announced]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        announced: { type: boolean }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
