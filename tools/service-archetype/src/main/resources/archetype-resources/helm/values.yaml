  repository: ghcr.io/OWNER/toefly-${artifactId}
  digest: ""
service:
  port: ${servicePort}
database:
  name: ${dbName}
  role: ${dbRole}
resources:
  requests: { cpu: 50m, memory: 320Mi }
  limits: { memory: 448Mi }
