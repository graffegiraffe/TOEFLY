# Git hooks (docs/12-implementation-plan.md §2.5). Install once: lefthook install. Never commit with --no-verify.
pre-commit:
  parallel: true
  commands:
    spotless:
      glob: "*.java"
      # Only modules that inherit toefly-parent declare Spotless, so the check runs in the modules of the staged files.
      run: >-
        ./mvnw -q -B spotless:check -pl "$(for f in {staged_files}; do d=$(dirname "$f");
        while [ ! -f "$d/pom.xml" ]; do d=$(dirname "$d"); done; echo "$d"; done | sort -u | paste -sd, -)"
    web:
      root: clients/web/
      glob: "*.{ts,tsx,js,css}"
      run: pnpm exec eslint {staged_files} && pnpm exec prettier --check {staged_files}
    landing:
      root: clients/landing/
      glob: "*.{ts,astro,js,css}"
      run: pnpm exec prettier --check {staged_files}
    ios:
      root: clients/ios/
      glob: "*.swift"
      run: swiftformat --lint {staged_files} && swiftlint lint --strict {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --yes -p @commitlint/cli@20 -p @commitlint/config-conventional@20 commitlint --edit {1}
