# Local OpenTelemetry Collector: services send OTLP here, the collector forwards to grafana/otel-lgtm.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter: { check_interval: 1s, limit_mib: 150 }
  resource:
    attributes:
      - { key: deployment.environment, value: local, action: upsert }
  batch: {}

exporters:
  otlphttp/lgtm:
    endpoint: http://lgtm:4318

service:
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/lgtm] }
    metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/lgtm] }
    logs: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/lgtm] }
