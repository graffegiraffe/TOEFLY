    enabled: true
    publicClient: false
    secret: $(env:SVC_API_GATEWAY_SECRET:-svc-api-gateway-local)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic, roles, toefly-api-audience, internal]
    optionalClientScopes: []
  - clientId: svc-profile-service
    name: profile-service service account
    enabled: true
    publicClient: false
    secret: $(env:SVC_PROFILE_SERVICE_SECRET:-svc-profile-service-local)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic, roles, toefly-api-audience, internal]
    optionalClientScopes: []
  - clientId: svc-content-service
    name: content-service service account
    enabled: true
    publicClient: false
    secret: $(env:SVC_CONTENT_SERVICE_SECRET:-svc-content-service-local)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic, roles, toefly-api-audience, internal]
    optionalClientScopes: []
  - clientId: svc-content-factory
    name: content-factory service account
    enabled: true
    publicClient: false
    secret: $(env:SVC_CONTENT_FACTORY_SECRET:-svc-content-factory-local)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic, roles, toefly-api-audience, internal]
    optionalClientScopes: []
  - clientId: svc-practice-service
    name: practice-service service account
    enabled: true
    publicClient: false
    secret: $(env:SVC_PRACTICE_SERVICE_SECRET:-svc-practice-service-local)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic, roles, toefly-api-audience, internal]
    optionalClientScopes: []
  - clientId: svc-assessment-service
    name: assessment-service service account
    enabled: true
    publicClient: false
    secret: $(env:SVC_ASSESSMENT_SERVICE_SECRET:-svc-assessment-service-local)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic, roles, toefly-api-audience, internal]
