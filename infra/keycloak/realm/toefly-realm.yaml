# Realm `toefly` as code, applied idempotently by keycloak-config-cli (docs/10-security-privacy.md §4).
# Secrets and provider keys come from infra/compose/.env; empty Google keys leave the provider disabled.
realm: toefly
enabled: true
displayName: TOEFLY
displayNameHtml: "<b>TOE</b><span class=\"toefly-fly\">FLY</span>"
# Docker Desktop forwards host requests from an address Keycloak treats as external, so local Compose sets none.
sslRequired: $(env:KEYCLOAK_SSL_REQUIRED:-external)
registrationAllowed: true
registrationEmailAsUsername: true
verifyEmail: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
resetPasswordAllowed: true
rememberMe: false
editUsernameAllowed: false
loginTheme: toefly
emailTheme: toefly
internationalizationEnabled: true
supportedLocales: [en, ru]
defaultLocale: en
# Length and a blocklist instead of composition rules (NIST SP 800-63B), AC-01.01.2.
passwordPolicy: length(10) and maxLength(128) and notUsername and notEmail and passwordHistory(3) and passwordBlacklist(common-passwords-10k.txt) and hashAlgorithm(argon2)
# Temporary lockout after 5 failures for 15 minutes (AC-01.05.2, AC-01.07.2).
bruteForceProtected: true
permanentLockout: false
failureFactor: 5
waitIncrementSeconds: 900
maxFailureWaitSeconds: 900
maxDeltaTimeSeconds: 900
quickLoginCheckMilliSeconds: 1000
minimumQuickLoginWaitSeconds: 60
accessTokenLifespan: 900
ssoSessionIdleTimeout: 28800
ssoSessionMaxLifespan: 36000
offlineSessionIdleTimeout: 2592000
offlineSessionMaxLifespanEnabled: true
offlineSessionMaxLifespan: 15552000
revokeRefreshToken: true
refreshTokenMaxReuse: 0
actionTokenGeneratedByUserLifespan: 1800
attributes:
  # Email verification links live 24 hours, password reset links 30 minutes (AC-01.02.1, AC-01.06.2).
  actionTokenGeneratedByUserLifespan.verify-email: "86400"
  actionTokenGeneratedByUserLifespan.reset-credentials: "1800"
eventsEnabled: true
eventsExpiration: 31536000
adminEventsEnabled: true
adminEventsDetailsEnabled: true
browserSecurityHeaders:
  contentSecurityPolicy: "frame-src 'self'; frame-ancestors 'none'; object-src 'none';"
  xFrameOptions: DENY
  xContentTypeOptions: nosniff
  strictTransportSecurity: max-age=15552000; includeSubDomains
  referrerPolicy: no-referrer
# Mailpit locally; Brevo when the KEYCLOAK_SMTP_* variables are set (docs/12-implementation-plan.md §8).
smtpServer:
  host: $(env:KEYCLOAK_SMTP_HOST:-mailpit)
  port: "$(env:KEYCLOAK_SMTP_PORT:-1025)"
  from: $(env:KEYCLOAK_SMTP_FROM:-no-reply@toefly.localhost)
  fromDisplayName: TOEFLY
  auth: "$(env:KEYCLOAK_SMTP_AUTH:-false)"
  starttls: "$(env:KEYCLOAK_SMTP_STARTTLS:-false)"
  user: $(env:KEYCLOAK_SMTP_USER:-)
  password: $(env:KEYCLOAK_SMTP_PASSWORD:-)
roles:
  realm:
    - name: STUDENT
      description: Learner preparing for the TOEFL iBT
    - name: TUTOR
      description: Tutor with connected students
    - name: ADMIN
      description: Content and platform administrator
defaultRoles:
  - STUDENT
browserFlow: toefly browser
# Built-in registration with the sign-up attempt notice first (AC-01.01.3, toefly-keycloak-extensions).
registrationFlow: toefly registration
# Security emails: password changed and second factor removed (AC-01.06.2, AC-01.07.4); KC_SPI_EVENTS_LISTENER
# settings in Compose limit the email listener to these events.
eventsListeners: [jboss-logging, email]
# The sign-up form asks for the account type and the required consents (AC-01.01.1, AC-01.01.4, AC-01.03.3).
# Keycloak keeps the declarative user profile as a component with the JSON configuration.
components:
  org.keycloak.userprofile.UserProfileProvider:
    - providerId: declarative-user-profile
      subComponents: {}
      config:
        kc.user.profile.config:
          - |
            {
              "unmanagedAttributePolicy": "ADMIN_EDIT",
              "attributes": [
                {
                  "name": "username",
                  "displayName": "${username}",
                  "validations": {
                    "length": {
                      "min": 3,
                      "max": 255
                    },
                    "username-prohibited-characters": {},
                    "up-username-not-idn-homograph": {}
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  }
                },
                {
                  "name": "email",
                  "displayName": "${email}",
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "validations": {
                    "email": {},
                    "length": {
                      "max": 255
                    }
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  }
                },
                {
                  "name": "firstName",
                  "displayName": "${firstName}",
                  "validations": {
                    "length": {
                      "max": 100
                    },
                    "person-name-prohibited-characters": {}
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  }
                },
                {
                  "name": "lastName",
                  "displayName": "${lastName}",
                  "validations": {
                    "length": {
                      "max": 100
                    },
                    "person-name-prohibited-characters": {}
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  }
                },
                {
                  "name": "accountType",
                  "displayName": "${toeflyAccountType}",
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "options": {
                      "options": [
                        "STUDENT",
                        "TUTOR"
                      ]
                    }
                  },
                  "annotations": {
                    "inputType": "select-radiobuttons",
                    "inputOptionLabels": {
                      "STUDENT": "${toeflyAccountStudent}",
                      "TUTOR": "${toeflyAccountTutor}"
                    }
                  }
                },
                {
                  "name": "termsAccepted",
                  "displayName": "${toeflyConsentTerms}",
                  "multivalued": true,
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "options": {
                      "options": [
                        "accepted"
                      ]
                    }
                  },
                  "annotations": {
                    "inputType": "multiselect-checkboxes",
                    "inputOptionLabels": {
                      "accepted": "${toeflyConsentTerms}"
                    }
                  }
                },
                {
                  "name": "privacyAccepted",
                  "displayName": "${toeflyConsentPrivacy}",
                  "multivalued": true,
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "options": {
                      "options": [
                        "accepted"
                      ]
                    }
                  },
                  "annotations": {
                    "inputType": "multiselect-checkboxes",
                    "inputOptionLabels": {
                      "accepted": "${toeflyConsentPrivacy}"
                    }
                  }
                },
                {
                  "name": "ageConfirmed",
                  "displayName": "${toeflyConsentAge}",
                  "multivalued": true,
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "options": {
                      "options": [
                        "accepted"
                      ]
                    }
                  },
                  "annotations": {
                    "inputType": "multiselect-checkboxes",
                    "inputOptionLabels": {
                      "accepted": "${toeflyConsentAge}"
                    }
                  }
                }
              ],
              "groups": []
            }
requiredActions:
  - alias: VERIFY_EMAIL
    name: Verify Email
    providerId: VERIFY_EMAIL
    enabled: true
    defaultAction: false
    priority: 50
    # 60 seconds between emails (AC-01.02.4); the hourly cap of five is in toefly-keycloak-extensions.
    config:
      emailResendCooldownSeconds: "60"
  - alias: CONFIGURE_TOTP
    name: Configure OTP
    providerId: CONFIGURE_TOTP
    enabled: true
    defaultAction: false
    priority: 10
  - alias: UPDATE_PASSWORD
    name: Update Password
    providerId: UPDATE_PASSWORD
    enabled: true
    defaultAction: false
    priority: 30
  - alias: TERMS_AND_CONDITIONS
    name: Terms and Conditions
    providerId: TERMS_AND_CONDITIONS
    enabled: false
    defaultAction: false
    priority: 20
otpPolicyType: totp
otpPolicyAlgorithm: HmacSHA1
otpPolicyDigits: 6
otpPolicyPeriod: 30
otpPolicyLookAheadWindow: 1
authenticationFlows:
  - alias: toefly registration
    description: Sign-up; a taken email gets a neutral answer and its owner a notice (AC-01.01.3)
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: registration-page-form
        flowAlias: toefly registration form
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: true
  - alias: toefly registration form
    description: Sign-up form actions
    providerId: form-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: toefly-sign-up-attempt-notice
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - authenticator: registration-user-creation
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
      - authenticator: registration-password-action
        requirement: REQUIRED
        priority: 30
        autheticatorFlow: false
  - alias: toefly browser
    description: Browser sign-in with TOTP for tutors, administrators and learners who turned it on
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
        priority: 10
        autheticatorFlow: false
      - authenticator: identity-provider-redirector
        requirement: ALTERNATIVE
        priority: 25
        autheticatorFlow: false
      - flowAlias: toefly browser forms
        requirement: ALTERNATIVE
        priority: 30
        autheticatorFlow: true
  - alias: toefly browser forms
    description: Password, then TOTP by role
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-username-password-form
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - flowAlias: toefly browser mfa tutor
        requirement: CONDITIONAL
        priority: 20
        autheticatorFlow: true
      - flowAlias: toefly browser mfa admin
        requirement: CONDITIONAL
        priority: 30
        autheticatorFlow: true
      - flowAlias: toefly browser mfa optional
        requirement: CONDITIONAL
        priority: 40
        autheticatorFlow: true
  - alias: toefly browser mfa tutor
    description: TOTP is required for tutors (AC-01.07.3)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        authenticatorConfig: toefly browser role tutor
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
  - alias: toefly browser mfa admin
    description: TOTP is required for administrators (AC-01.07.3)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        authenticatorConfig: toefly browser role admin
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
  - alias: toefly browser mfa optional
    description: Learners who turned TOTP on are asked for a code (AC-01.07.2, AC-01.07.5)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - authenticator: conditional-user-role
        authenticatorConfig: toefly browser not tutor
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
      - authenticator: conditional-user-role
        authenticatorConfig: toefly browser not admin
        requirement: REQUIRED
        priority: 30
        autheticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 40
        autheticatorFlow: false
  - alias: toefly post broker login
    description: TOTP after Google or Apple by the same rules (AC-01.07.5)
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - flowAlias: toefly broker mfa tutor
        requirement: CONDITIONAL
        priority: 10
        autheticatorFlow: true
      - flowAlias: toefly broker mfa admin
        requirement: CONDITIONAL
        priority: 20
        autheticatorFlow: true
      - flowAlias: toefly broker mfa optional
        requirement: CONDITIONAL
        priority: 30
        autheticatorFlow: true
  - alias: toefly broker mfa tutor
    description: TOTP is required for tutors (AC-01.07.3)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        authenticatorConfig: toefly broker role tutor
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
  - alias: toefly broker mfa admin
    description: TOTP is required for administrators (AC-01.07.3)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        authenticatorConfig: toefly broker role admin
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
  - alias: toefly broker mfa optional
    description: Learners who turned TOTP on are asked for a code (AC-01.07.2, AC-01.07.5)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
      - authenticator: conditional-user-role
        authenticatorConfig: toefly broker not tutor
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
      - authenticator: conditional-user-role
        authenticatorConfig: toefly broker not admin
        requirement: REQUIRED
        priority: 30
        autheticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 40
        autheticatorFlow: false
authenticatorConfig:
  - alias: toefly browser role tutor
    config:
      condUserRole: TUTOR
      negate: "false"
  - alias: toefly browser role admin
    config:
      condUserRole: ADMIN
      negate: "false"
  - alias: toefly browser not tutor
    config:
      condUserRole: TUTOR
      negate: "true"
  - alias: toefly browser not admin
    config:
      condUserRole: ADMIN
      negate: "true"
  - alias: toefly broker role tutor
    config:
      condUserRole: TUTOR
      negate: "false"
  - alias: toefly broker role admin
    config:
      condUserRole: ADMIN
      negate: "false"
  - alias: toefly broker not tutor
    config:
      condUserRole: TUTOR
      negate: "true"
  - alias: toefly broker not admin
    config:
      condUserRole: ADMIN
      negate: "true"
identityProviders:
  - alias: google
    displayName: Google
    providerId: google
    enabled: $(env:GOOGLE_IDP_ENABLED:-false)
    # Google confirms the address, so no second verification (AC-01.02.5); linking needs the password (AC-01.03.2).
    trustEmail: true
    storeToken: false
    addReadTokenRoleOnCreate: false
    linkOnly: false
    firstBrokerLoginFlowAlias: first broker login
    postBrokerLoginFlowAlias: toefly post broker login
    config:
      clientId: $(env:GOOGLE_CLIENT_ID:-not-configured)
      clientSecret: $(env:GOOGLE_CLIENT_SECRET:-not-configured)
      defaultScope: openid email profile
      syncMode: IMPORT
      hideOnLoginPage: "false"
  # Sign in with Apple needs a paid Apple Developer account (docs/12 §8); disabled until its keys exist.
  - alias: apple
    displayName: Apple
    providerId: oidc
    enabled: $(env:APPLE_IDP_ENABLED:-false)
    trustEmail: true
    storeToken: false
    firstBrokerLoginFlowAlias: first broker login
    postBrokerLoginFlowAlias: toefly post broker login
    config:
      issuer: https://appleid.apple.com
      authorizationUrl: https://appleid.apple.com/auth/authorize
      tokenUrl: https://appleid.apple.com/auth/token
      jwksUrl: https://appleid.apple.com/auth/keys
      validateSignature: "true"
      useJwksUrl: "true"
      clientId: $(env:APPLE_CLIENT_ID:-not-configured)
      clientSecret: $(env:APPLE_CLIENT_SECRET:-not-configured)
      clientAuthMethod: client_secret_post
      defaultScope: openid name email
      syncMode: IMPORT
clientScopes:
  - name: toefly-api-audience
    description: Audience toefly-api of every service (docs/05-api-contracts.md §2.8)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: toefly-api audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.custom.audience: toefly-api
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"
  - name: toefly-signup
    description: Account type and consents of the sign-up form for profile-service
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: accountType
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: accountType
          claim.name: account_type
          jsonType.label: String
          multivalued: "true"
          access.token.claim: "true"
          id.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "true"
      - name: termsAccepted
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: termsAccepted
          claim.name: consents.terms
          jsonType.label: String
          multivalued: "true"
          access.token.claim: "true"
          id.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "true"
      - name: privacyAccepted
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: privacyAccepted
          claim.name: consents.privacy
          jsonType.label: String
          multivalued: "true"
          access.token.claim: "true"
          id.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "true"
      - name: ageConfirmed
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: ageConfirmed
          claim.name: consents.age
          jsonType.label: String
          multivalued: "true"
          access.token.claim: "true"
          id.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "true"
  - name: internal
    description: Calls between services with client credentials (docs/10-security-privacy.md §7.2)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
clients:
  - clientId: toefly-web-bff
    name: TOEFLY web (BFF in api-gateway)
    enabled: true
    publicClient: false
    secret: $(env:TOEFLY_WEB_BFF_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris: ["$(env:TOEFLY_GATEWAY_URL:-http://api.toefly.localhost:8080)/auth/callback"]
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "$(env:TOEFLY_WEB_URL:-http://app.toefly.localhost:5173)/*"
      use.refresh.tokens: "true"
    defaultClientScopes: [basic, acr, roles, email, profile, toefly-api-audience, toefly-signup]
    optionalClientScopes: [offline_access]
  - clientId: toefly-ios
    name: TOEFLY iOS
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    redirectUris: ["app.toefly://oauth/callback"]
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      use.refresh.tokens: "true"
    defaultClientScopes: [basic, acr, roles, email, profile, toefly-api-audience, toefly-signup]
    optionalClientScopes: [offline_access]
  - clientId: svc-api-gateway
